<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Anonymization workflow and the two time modes</title>
  <style>
    .bg { fill: #ffffff; }
    .step { fill: #e8f0fb; stroke: #3b6fb6; stroke-width: 1.3; }
    .num { fill: #3b6fb6; }
    .numt { fill: #ffffff; font-weight: 700; }
    .t { fill: #1f2933; font-weight: 600; }
    .m { fill: #52606d; font-size: 11.5px; }
    .ax { stroke: #8796a8; stroke-width: 1; }
    .orig { fill: #c7cfd9; }
    .ref { fill: #3b6fb6; }
    .other { fill: #6aa0e0; }
    .arrow { stroke: #8796a8; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .dash { stroke: #c9a227; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .panel { fill: #f7f9fc; stroke: #d5dde7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .step { fill: #102038; stroke: #6ea3ea; }
      .num { fill: #6ea3ea; }
      .numt { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9aa7b4; }
      .ax, .arrow { stroke: #6e7681; }
      .orig { fill: #3a4450; }
      .ref { fill: #6ea3ea; }
      .other { fill: #3d6aa8; }
      .dash { stroke: #d6b347; }
      .panel { fill: #161b22; stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8796a8"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="330" rx="10"/>

  <!-- six steps -->
  <g>
    <rect class="step" x="14" y="14" width="114" height="62" rx="8"/>
    <circle class="num" cx="32" cy="32" r="10"/><text class="numt" x="28" y="37">1</text>
    <text class="t" x="48" y="37">Select</text><text class="m" x="24" y="62">recordings</text>

    <rect class="step" x="138" y="14" width="114" height="62" rx="8"/>
    <circle class="num" cx="156" cy="32" r="10"/><text class="numt" x="152" y="37">2</text>
    <text class="t" x="172" y="37">Time</text><text class="m" x="148" y="62">reference + mode</text>

    <rect class="step" x="262" y="14" width="114" height="62" rx="8"/>
    <circle class="num" cx="280" cy="32" r="10"/><text class="numt" x="276" y="37">3</text>
    <text class="t" x="296" y="37">Identity</text><text class="m" x="272" y="62">what to remove</text>

    <rect class="step" x="386" y="14" width="114" height="62" rx="8"/>
    <circle class="num" cx="404" cy="32" r="10"/><text class="numt" x="400" y="37">4</text>
    <text class="t" x="420" y="37">Output</text><text class="m" x="396" y="62">folder, names</text>

    <rect class="step" x="510" y="14" width="114" height="62" rx="8"/>
    <circle class="num" cx="528" cy="32" r="10"/><text class="numt" x="524" y="37">5</text>
    <text class="t" x="544" y="37">Run</text><text class="m" x="520" y="62">writes copies only</text>

    <rect class="step" x="634" y="14" width="114" height="62" rx="8"/>
    <circle class="num" cx="652" cy="32" r="10"/><text class="numt" x="648" y="37">6</text>
    <text class="t" x="668" y="37">Verify</text><text class="m" x="644" y="62">report per copy</text>
  </g>
  <path class="arrow" d="M128 45 H136"/><path class="arrow" d="M252 45 H260"/><path class="arrow" d="M376 45 H384"/>
  <path class="arrow" d="M500 45 H508"/><path class="arrow" d="M624 45 H632"/>

  <!-- relative mode -->
  <rect class="panel" x="14" y="92" width="362" height="224" rx="8"/>
  <text class="t" x="28" y="116">Relative mode</text>
  <text class="m" x="28" y="133">all recordings move by the same amount: gaps kept</text>
  <text class="m" x="28" y="160">original</text>
  <line class="ax" x1="90" y1="172" x2="362" y2="172"/>
  <rect class="ref" x="96" y="150" width="70" height="14" rx="3"/>
  <rect class="other" x="186" y="150" width="56" height="14" rx="3"/>
  <rect class="other" x="270" y="150" width="60" height="14" rx="3"/>
  <text class="m" x="96" y="188">reference (earliest)</text>
  <text class="m" x="28" y="246">copies</text>
  <line class="ax" x1="90" y1="258" x2="362" y2="258"/>
  <rect class="ref" x="126" y="236" width="70" height="14" rx="3"/>
  <rect class="other" x="216" y="236" width="56" height="14" rx="3"/>
  <rect class="other" x="300" y="236" width="60" height="14" rx="3"/>
  <line class="dash" x1="96" y1="196" x2="126" y2="230"/>
  <line class="dash" x1="186" y1="196" x2="216" y2="230"/>
  <line class="dash" x1="270" y1="196" x2="300" y2="230"/>
  <text class="m" x="28" y="290">the reference gets a new date (time of day kept, or set);</text>
  <text class="m" x="28" y="305">the others follow by the same shift</text>

  <!-- aligned mode -->
  <rect class="panel" x="386" y="92" width="362" height="224" rx="8"/>
  <text class="t" x="400" y="116">Aligned mode</text>
  <text class="m" x="400" y="133">every recording starts at the same chosen moment</text>
  <text class="m" x="400" y="160">original</text>
  <line class="ax" x1="462" y1="172" x2="734" y2="172"/>
  <rect class="ref" x="468" y="150" width="70" height="14" rx="3"/>
  <rect class="other" x="568" y="150" width="56" height="14" rx="3"/>
  <rect class="other" x="662" y="150" width="60" height="14" rx="3"/>
  <text class="m" x="400" y="226">copies</text>
  <line class="ax" x1="462" y1="282" x2="734" y2="282"/>
  <rect class="ref" x="500" y="218" width="70" height="14" rx="3"/>
  <rect class="other" x="500" y="240" width="56" height="14" rx="3"/>
  <rect class="other" x="500" y="262" width="60" height="14" rx="3"/>
  <line class="dash" x1="500" y1="210" x2="500" y2="286"/>
  <text class="m" x="508" y="302">common start</text>
</svg>
