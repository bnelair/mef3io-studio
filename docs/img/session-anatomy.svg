<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Anatomy of a MEF 3.0 recording</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f3f6fa; stroke: #8796a8; stroke-width: 1.2; }
    .sess { fill: #e8f0fb; stroke: #3b6fb6; stroke-width: 1.5; }
    .seg { fill: #ffffff; stroke: #8796a8; stroke-width: 1; }
    .file { fill: #fff8e6; stroke: #c9a227; stroke-width: 1; }
    .data { fill: #e9f6ec; stroke: #3f8f55; stroke-width: 1; }
    .blk { fill: #3f8f55; }
    .t { fill: #1f2933; }
    .m { fill: #52606d; font-size: 11.5px; }
    .h { fill: #1f2933; font-weight: 600; }
    .ln { stroke: #8796a8; stroke-width: 1.2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #6e7681; }
      .sess { fill: #102038; stroke: #6ea3ea; }
      .seg { fill: #0d1117; stroke: #6e7681; }
      .file { fill: #2b2410; stroke: #d6b347; }
      .data { fill: #11281a; stroke: #5fbf7a; }
      .blk { fill: #5fbf7a; }
      .t, .h { fill: #e6edf3; }
      .m { fill: #9aa7b4; }
      .ln { stroke: #6e7681; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="330" rx="10"/>

  <!-- session -->
  <rect class="sess" x="16" y="16" width="688" height="298" rx="10"/>
  <text class="h" x="32" y="40">recording.mefd/</text>
  <text class="m" x="150" y="40">the session — one folder, or one .mefd.tar file</text>

  <!-- channel -->
  <rect class="box" x="32" y="54" width="656" height="246" rx="8"/>
  <text class="h" x="46" y="76">ch01.timd/</text>
  <text class="m" x="128" y="76">one folder per channel (ch02.timd, ch03.timd, …)</text>

  <!-- segment 0 -->
  <rect class="seg" x="46" y="88" width="628" height="96" rx="6"/>
  <text class="t" x="58" y="106">ch01-000000.segd/</text>
  <text class="m" x="190" y="106">a segment: one continuous stretch of the channel</text>
  <rect class="file" x="58" y="116" width="140" height="58" rx="5"/>
  <text class="t" x="68" y="136">.tmet</text>
  <text class="m" x="112" y="136">16 KB</text>
  <text class="m" x="68" y="152">metadata and</text>
  <text class="m" x="68" y="166">patient details</text>
  <rect class="file" x="208" y="116" width="150" height="58" rx="5"/>
  <text class="t" x="218" y="136">.tidx</text>
  <text class="m" x="218" y="152">index: where + when</text>
  <text class="m" x="218" y="166">each block starts</text>
  <rect class="data" x="368" y="116" width="294" height="58" rx="5"/>
  <text class="t" x="378" y="136">.tdat</text>
  <text class="m" x="418" y="136">compressed blocks of samples</text>
  <g class="blk">
    <rect x="378" y="146" width="30" height="18" rx="2"/>
    <rect x="412" y="146" width="30" height="18" rx="2"/>
    <rect x="446" y="146" width="30" height="18" rx="2"/>
    <rect x="480" y="146" width="30" height="18" rx="2"/>
    <rect x="514" y="146" width="30" height="18" rx="2"/>
    <rect x="548" y="146" width="30" height="18" rx="2"/>
    <rect x="582" y="146" width="30" height="18" rx="2"/>
    <rect x="616" y="146" width="30" height="18" rx="2"/>
  </g>
  <path class="ln" d="M283 174 C 300 200, 380 200, 393 166"/>
  <text class="m" x="250" y="205">the index points straight at each block</text>

  <!-- segment 1 -->
  <rect class="seg" x="46" y="218" width="628" height="70" rx="6"/>
  <text class="t" x="58" y="238">ch01-000001.segd/</text>
  <text class="m" x="190" y="238">the next segment (e.g. after a pause in the recording)</text>
  <rect class="file" x="58" y="248" width="140" height="30" rx="5"/>
  <text class="t" x="68" y="268">.tmet</text>
  <rect class="file" x="208" y="248" width="150" height="30" rx="5"/>
  <text class="t" x="218" y="268">.tidx</text>
  <rect class="data" x="368" y="248" width="294" height="30" rx="5"/>
  <text class="t" x="378" y="268">.tdat</text>
</svg>
