<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>How mef3io-studio relates to mef3io and mef3io-server</title>
  <style>
    .bg { fill: #ffffff; }
    .app { fill: #e8f0fb; stroke: #3b6fb6; stroke-width: 1.5; }
    .lib { fill: #e9f6ec; stroke: #3f8f55; stroke-width: 1.5; }
    .srv { fill: #f1ecfb; stroke: #6f4fb8; stroke-width: 1.4; }
    .disk { fill: #fff8e6; stroke: #c9a227; stroke-width: 1.2; }
    .other { fill: #f3f6fa; stroke: #8796a8; stroke-width: 1.2; }
    .t { fill: #1f2933; font-weight: 600; }
    .m { fill: #52606d; font-size: 11.5px; }
    .arrow { stroke: #52606d; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .darrow { stroke: #6f4fb8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .app { fill: #102038; stroke: #6ea3ea; }
      .lib { fill: #11281a; stroke: #5fbf7a; }
      .srv { fill: #1d1633; stroke: #a58be6; }
      .other { fill: #161b22; stroke: #6e7681; }
      .disk { fill: #2b2410; stroke: #d6b347; }
      .t { fill: #e6edf3; }
      .m { fill: #9aa7b4; }
      .arrow { stroke: #9aa7b4; }
      .darrow { stroke: #a58be6; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8796a8"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="640" height="316" rx="10"/>

  <rect class="app" x="20" y="20" width="270" height="96" rx="10"/>
  <text class="t" x="36" y="46">mef3io-studio</text>
  <text class="m" x="36" y="66">desktop app: screens and workflow</text>
  <text class="m" x="36" y="84">explore · edit · encrypt · anonymize</text>
  <text class="m" x="36" y="102">next: viewer · annotations · export</text>

  <rect class="other" x="350" y="20" width="270" height="96" rx="10"/>
  <text class="t" x="366" y="46">Your scripts</text>
  <text class="m" x="366" y="66">Python · MATLAB · C++</text>
  <text class="m" x="366" y="84">command line: python -m mef3io</text>
  <text class="m" x="366" y="102">— the same operations, no app needed</text>

  <rect class="srv" x="20" y="150" width="232" height="92" rx="10"/>
  <text class="t" x="36" y="174">mef3io-server</text>
  <text class="m" x="36" y="193">metadata · tile cache · prefetch</text>
  <text class="m" x="36" y="210">parallel decode across processes</text>
  <text class="m" x="36" y="227">in the app, or remote over gRPC</text>

  <rect class="lib" x="300" y="150" width="320" height="62" rx="10"/>
  <text class="t" x="316" y="176">mef3io library</text>
  <text class="m" x="316" y="196">all reading, writing, checking, anonymization</text>

  <rect class="disk" x="340" y="262" width="240" height="40" rx="8"/>
  <text class="t" x="356" y="287">.mefd / .mefd.tar</text>

  <!-- studio -> library (file operations, v0.1) -->
  <path class="arrow" d="M250 116 V132 H340 V148"/>
  <!-- studio -> server (viewer, next) -->
  <path class="darrow" d="M80 116 V148"/>
  <text class="m" x="88" y="138">viewer (next)</text>
  <!-- server -> library -->
  <path class="arrow" d="M252 190 H298"/>
  <!-- scripts -> library -->
  <path class="arrow" d="M485 116 V148"/>
  <!-- library -> files -->
  <path class="arrow" d="M460 212 V260"/>
</svg>
