<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>How mef3io-studio relates to mef3io and mef3io-server</title>
  <style>
    .bg { fill: #ffffff; }
    .app { fill: #e8f0fb; stroke: #3b6fb6; stroke-width: 1.5; }
    .lib { fill: #e9f6ec; stroke: #3f8f55; stroke-width: 1.5; }
    .srv { fill: #f3f6fa; stroke: #8796a8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .disk { fill: #fff8e6; stroke: #c9a227; stroke-width: 1.2; }
    .other { fill: #f3f6fa; stroke: #8796a8; stroke-width: 1.2; }
    .t { fill: #1f2933; font-weight: 600; }
    .m { fill: #52606d; font-size: 11.5px; }
    .arrow { stroke: #52606d; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .darrow { stroke: #8796a8; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .app { fill: #102038; stroke: #6ea3ea; }
      .lib { fill: #11281a; stroke: #5fbf7a; }
      .srv, .other { fill: #161b22; stroke: #6e7681; }
      .disk { fill: #2b2410; stroke: #d6b347; }
      .t { fill: #e6edf3; }
      .m { fill: #9aa7b4; }
      .arrow { stroke: #9aa7b4; }
      .darrow { stroke: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8796a8"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="640" height="300" rx="10"/>

  <rect class="app" x="20" y="20" width="250" height="96" rx="10"/>
  <text class="t" x="36" y="46">mef3io-studio</text>
  <text class="m" x="36" y="66">desktop app: screens and workflow</text>
  <text class="m" x="36" y="84">explorer · anonymizer</text>
  <text class="m" x="36" y="102">later: viewer · annotations · export</text>

  <rect class="other" x="370" y="20" width="250" height="96" rx="10"/>
  <text class="t" x="386" y="46">Your scripts</text>
  <text class="m" x="386" y="66">Python · MATLAB · C++</text>
  <text class="m" x="386" y="84">command line: python -m mef3io</text>
  <text class="m" x="386" y="102">— the same operations, no app needed</text>

  <rect class="lib" x="200" y="156" width="360" height="62" rx="10"/>
  <text class="t" x="216" y="182">mef3io library</text>
  <text class="m" x="216" y="202">all reading, writing, checking and anonymization</text>

  <rect class="disk" x="260" y="246" width="240" height="40" rx="8"/>
  <text class="t" x="276" y="271">.mefd / .mefd.tar</text>

  <rect class="srv" x="20" y="246" width="170" height="40" rx="8"/>
  <text class="t" x="34" y="266">mef3io-server</text>
  <text class="m" x="34" y="280">later: remote recordings</text>

  <path class="arrow" d="M235 116 V154"/>
  <path class="arrow" d="M495 116 V154"/>
  <path class="arrow" d="M380 218 V244"/>
  <path class="darrow" d="M80 116 V244"/>
</svg>
