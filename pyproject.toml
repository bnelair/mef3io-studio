# Development and test configuration ONLY.
#
# mef3io-studio is NOT published to PyPI: users get installers from the GitHub
# Releases page (built by .github/workflows/build.yml). This file exists so a
# developer can `pip install -e .[dev]` and run the app and its tests from
# source. The "Private :: Do Not Upload" classifier makes PyPI reject an
# accidental upload.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mef3io-studio"
dynamic = ["version"]
description = "Desktop app for exploring and anonymizing MEF 3.0 recordings (distributed as installers, not on PyPI)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    # Exact pins: an installer must bundle exactly these, so behaviour never
    # changes silently underneath a release. Bump deliberately, in a PR.
    "mef3io==1.3.0",
    "PySide6-Essentials==6.12.0",
    "platformdirs==4.13.0",
    # The IANA time-zone database for zoneinfo: Windows has none of its own.
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller==6.22.3",
]

[project.scripts]
mef3io-studio = "mef3io_studio.app:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mef3io_studio = ["resources/icons/*.svg", "resources/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packaging/*.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]
# Relative imports inside the package are fine; TID is here for the banned API list.
ignore = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mef3io._mef3io".msg = "Use mef3io's public API only."
"mef3io._reader".msg = "Use mef3io's public API only."
"mef3io._writer".msg = "Use mef3io's public API only."
"mef3io._archive".msg = "Use mef3io's public API only."

[tool.ruff.lint.per-file-ignores]
# The style sheet is a long template string; wrapping it would hurt readability.
"src/mef3io_studio/common/theme.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mef3io_studio", "conftest"]
