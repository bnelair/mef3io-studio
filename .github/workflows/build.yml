name: Build installers

# Builds the desktop app with PyInstaller on Windows, macOS and Linux, wraps it
# into an installer per platform, and smoke-tests each packaged app with
# `--self-test` (writes and reads a tiny synthetic recording with the bundled
# mef3io, and builds the main window offscreen). On a `v*` tag the installers
# are attached to a GitHub Release. The app is NOT published to PyPI.
#
# TODO(signing): nothing is code-signed yet (certificates undecided, #3). The
# hooks are marked "TODO(signing)" below and in packaging/.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
      - name: App icon
        run: python scripts/render_icons.py --ico packaging/windows/mef3io-studio.ico
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/mef3io-studio.spec
      - name: Smoke-test the onedir app
        shell: pwsh
        run: ./packaging/windows/selftest.ps1 -Exe "dist\mef3io-studio\mef3io-studio.exe"
      # TODO(signing): Authenticode-sign dist\mef3io-studio\mef3io-studio.exe here.
      - name: Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          iscc /DAppVersion=$version /DSourceDir="$PWD\dist\mef3io-studio" /DOutputDir="$PWD\dist" `
               /DSetupIcon="$PWD\packaging\windows\mef3io-studio.ico" packaging\windows\mef3io-studio.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      # TODO(signing): Authenticode-sign the setup .exe here.
      - name: Install silently and smoke-test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\mef3io-studio-*-windows-x64-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "mef3io-studio-installed"
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$target`""
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          ./packaging/windows/selftest.ps1 -Exe (Join-Path $target "mef3io-studio.exe")
      - name: Portable zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path dist\mef3io-studio -DestinationPath "dist\mef3io-studio-$version-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mef3io-studio-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
      - name: App icon
        run: |
          python scripts/render_icons.py --iconset build/mef3io-studio.iconset
          iconutil -c icns build/mef3io-studio.iconset -o packaging/macos/mef3io-studio.icns
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/mef3io-studio.spec
      - name: Smoke-test the .app
        run: |
          out="$(dist/mef3io-studio.app/Contents/MacOS/mef3io-studio --self-test)"
          echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      # TODO(signing): codesign with Developer ID + notarize + staple (see packaging/macos/make_dmg.sh).
      - name: Disk image
        run: packaging/macos/make_dmg.sh
      - name: Smoke-test the app inside the .dmg
        run: |
          dmg="$(ls dist/*.dmg)"
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          out="$("$RUNNER_TEMP/dmg/mef3io-studio.app/Contents/MacOS/mef3io-studio" --self-test)"
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      - uses: actions/upload-artifact@v4
        with:
          name: mef3io-studio-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux x64
    # The oldest supported runner: the bundle needs a glibc at least as new as
    # the build machine's, so building on 22.04 runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt runtime libraries (collected into the bundle)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-shape0 libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/mef3io-studio.spec
      - name: Smoke-test the onedir app
        run: |
          out="$(env -u QT_QPA_PLATFORM dist/mef3io-studio/mef3io-studio --self-test)"
          echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      - name: Tarball and AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/package.sh
      - name: Smoke-test the AppImage
        run: |
          out="$(dist/*.AppImage --appimage-extract-and-run --self-test)"
          echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      - uses: actions/upload-artifact@v4
        with:
          name: mef3io-studio-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" \
            || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          notes="Installers for Windows, macOS and Linux. These builds are NOT code-signed yet:
          Windows SmartScreen and macOS Gatekeeper will ask you to confirm the first launch."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "mef3io-studio $GITHUB_REF_NAME" \
              --notes "$notes" --prerelease
          fi
