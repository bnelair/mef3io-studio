name: Build installers

# Builds the desktop app with PyInstaller on Windows, macOS and Linux, wraps it
# into an installer per platform, and smoke-tests each packaged app:
#   --self-test      writes and reads a tiny synthetic recording with the
#                    bundled mef3io (through a helper process, as the app
#                    does) and builds the main window offscreen;
#   --self-test-gui  the same with the platform's real display plugin
#                    (Windows/macOS natively, Linux under Xvfb).
# The bundle is also checked for files that must not ship (network plugins,
# GPL readline, ...) and for the licence folder; on Linux the app runs under
# strace and must not open an internet socket. On a `v*` tag the installers
# and a SHA256SUMS file are attached to a GitHub Release, described by
# docs/release-notes/<VERSION>.md when that file exists.
# The app is NOT published to PyPI.
#
# Reproducible inputs: Python packages from requirements/build.lock (hashed),
# appimagetool + AppImage runtime and Inno Setup pinned by version and SHA-256.
#
# TODO(signing): nothing is code-signed yet (certificates undecided, #3). The
# hooks are marked "TODO(signing)" below and in packaging/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "requirements/**"
      - "scripts/render_icons.py"
      - ".github/workflows/build.yml"
      - "pyproject.toml"
      - "VERSION"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (hashed lock file)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/build.lock
          pip install --no-deps --no-build-isolation .
      - name: App icon
        run: python scripts/render_icons.py --ico packaging/windows/mef3io-studio.ico
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/mef3io-studio.spec
      - name: Check the bundle contents
        run: python packaging/check_bundle.py dist/mef3io-studio
      - name: Smoke-test the onedir app (offscreen, then the real display)
        shell: pwsh
        run: |
          ./packaging/windows/selftest.ps1 -Exe "dist\mef3io-studio\mef3io-studio.exe"
          ./packaging/windows/selftest.ps1 -Exe "dist\mef3io-studio\mef3io-studio.exe" -Gui
      # TODO(signing): Authenticode-sign dist\mef3io-studio\mef3io-studio.exe here.
      - name: Inno Setup (pinned)
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup hash mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          iscc /DAppVersion=$version /DSourceDir="$PWD\dist\mef3io-studio" /DOutputDir="$PWD\dist" `
               /DSetupIcon="$PWD\packaging\windows\mef3io-studio.ico" packaging\windows\mef3io-studio.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      # TODO(signing): Authenticode-sign the setup .exe here.
      - name: Install, upgrade and uninstall (smoke-testing each step)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\mef3io-studio-*-windows-x64-setup.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP "mef3io-studio-installed"
          $args = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$target`""
          # 1. fresh install
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList $args
          if ($p.ExitCode -ne 0) { throw "install exited with $($p.ExitCode)" }
          ./packaging/windows/selftest.ps1 -Exe (Join-Path $target "mef3io-studio.exe")
          # 2. upgrade over it: a file the old version had must disappear
          $stale = Join-Path $target "_internal\left-over-from-old-version.dll"
          "stale" | Out-File $stale
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList $args
          if ($p.ExitCode -ne 0) { throw "upgrade exited with $($p.ExitCode)" }
          if (Test-Path $stale) { throw "upgrade left an old file behind" }
          ./packaging/windows/selftest.ps1 -Exe (Join-Path $target "mef3io-studio.exe")
          # 3. uninstall, removing preferences and logs
          $logs = Join-Path $env:LOCALAPPDATA "BNEL\mef3io-studio"
          if (-not (Test-Path $logs)) { throw "expected the app's log folder at $logs" }
          $p = Start-Process -FilePath (Join-Path $target "unins000.exe") -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/REMOVEUSERDATA=1"
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3   # the uninstaller finishes from a temp copy
          if (Test-Path (Join-Path $target "mef3io-studio.exe")) { throw "uninstall left the app behind" }
          if (Test-Path $logs) { throw "uninstall with /REMOVEUSERDATA=1 left the user data" }
          Write-Host "install -> upgrade -> uninstall OK"
      - name: Portable zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path dist\mef3io-studio -DestinationPath "dist\mef3io-studio-$version-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mef3io-studio-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (hashed lock file)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/build.lock
          pip install --no-deps --no-build-isolation .
      - name: App icon
        run: |
          python scripts/render_icons.py --iconset build/mef3io-studio.iconset
          iconutil -c icns build/mef3io-studio.iconset -o packaging/macos/mef3io-studio.icns
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/mef3io-studio.spec
      - name: Check the bundle contents
        run: python packaging/check_bundle.py dist/mef3io-studio.app
      - name: Smoke-test the .app (offscreen, then the real display)
        run: |
          app=dist/mef3io-studio.app/Contents/MacOS/mef3io-studio
          out="$("$app" --self-test)"; echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
          out="$(env -u QT_QPA_PLATFORM "$app" --self-test-gui)"; echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK.*display cocoa"
      # TODO(signing): codesign with Developer ID + notarize + staple (see packaging/macos/make_dmg.sh).
      - name: Disk image
        run: packaging/macos/make_dmg.sh
      - name: Smoke-test the app inside the .dmg
        run: |
          dmg="$(ls dist/*.dmg)"
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          out="$("$RUNNER_TEMP/dmg/mef3io-studio.app/Contents/MacOS/mef3io-studio" --self-test)"
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      - uses: actions/upload-artifact@v7
        with:
          name: mef3io-studio-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux x64 (built on AlmaLinux 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build in AlmaLinux 9 (glibc 2.34 floor)
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:9 \
            bash -c "packaging/linux/build-in-container.sh; rc=\$?; chown -R $(id -u):$(id -g) dist build; exit \$rc"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tools for the checks (Xvfb, strace) and an icon renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth strace \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/build.lock
      - name: Check the bundle contents
        run: python packaging/check_bundle.py dist/mef3io-studio
      - name: Smoke-test (offscreen)
        run: |
          out="$(env -u QT_QPA_PLATFORM dist/mef3io-studio/mef3io-studio --self-test)"; echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      - name: Smoke-test the real display under Xvfb, and prove no internet socket is opened
        run: |
          xvfb-run -a packaging/linux/no_network_check.sh \
            env -u QT_QPA_PLATFORM dist/mef3io-studio/mef3io-studio --self-test-gui | tee gui.txt
          grep -q "^mef3io-studio self-test OK.*display xcb" gui.txt
      - name: AppImage (pinned appimagetool and runtime)
        run: PYTHON=python packaging/linux/make_appimage.sh
      - name: Smoke-test the AppImage
        run: |
          out="$(dist/*.AppImage --appimage-extract-and-run --self-test)"; echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"
      - uses: actions/upload-artifact@v7
        with:
          name: mef3io-studio-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  linux-distros:
    name: Linux on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "rockylinux:9", "fedora:latest"]
    steps:
      - name: Desktop OpenGL libraries (present on any desktop install)
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y libgl1 libegl1
          else
            dnf -y install libglvnd-glx libglvnd-egl
          fi
      - uses: actions/download-artifact@v8
        with:
          name: mef3io-studio-linux-x86_64
          path: dist
      - name: Self-test the tarball
        run: |
          tar -C /tmp -xzf dist/*.tar.gz
          out="$(/tmp/mef3io-studio/mef3io-studio --self-test)"; echo "$out"
          echo "$out" | grep -q "^mef3io-studio self-test OK"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, linux-distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" \
            || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release and attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
        # The release description is docs/release-notes/<VERSION>.md when that
        # file exists (written for testers in the pre-release docs revision),
        # otherwise the short generic text below.
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          notes_file="docs/release-notes/${version}.md"
          if [ -f "$notes_file" ]; then
            echo "release notes: $notes_file"
          else
            notes_file="$RUNNER_TEMP/release-notes.md"
            printf '%s\n' \
              "Installers for Windows, macOS (14 or later) and Linux. Verify downloads against SHA256SUMS." \
              "These builds are NOT code-signed yet: Windows SmartScreen and macOS Gatekeeper will ask you to confirm the first launch." \
              > "$notes_file"
            echo "no docs/release-notes/${version}.md; using the generic text"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "mef3io-studio $GITHUB_REF_NAME" \
              --notes-file "$notes_file" --prerelease
          fi
